# ==============================================================================
# SENTRA Cyber Threat Defense Platform — Render Blueprint Specification
# Infrastructure as Code (IaC) for automated cloud deployment on Render
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

databases:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Instance
  # ----------------------------------------------------------------------------
  - name: sentra-db
    databaseName: sentra
    user: sentra_user
    plan: free # Can be upgraded to 'starter' for production high-availability
    ipAllowList: [] # Allows private & secure access from Render web services

services:
  # ----------------------------------------------------------------------------
  # 2. FastAPI Threat Defense Backend API (Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: sentra-backend
    runtime: python
    rootDir: backend
    plan: free # Can be upgraded to 'starter' (512MB RAM, no sleep)
    buildCommand: pip install -r requirements.txt
    startCommand: python migrate.py && python run.py
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentra-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DOCS_ENABLED
        value: "true"
      # Explicitly allow the deployed frontend origin and localhost for dev
      - key: CORS_ORIGINS
        value: "https://sentra-frontend-5u9x.onrender.com,http://localhost:5173,http://localhost:3000"
      # Regex allows any *.onrender.com subdomain (covers preview deploys)
      - key: CORS_ORIGIN_REGEX
        value: "^https://[a-z0-9-]+\\.onrender\\.com$"
      - key: WEB_CONCURRENCY
        value: "1"

  # ----------------------------------------------------------------------------
  # 3. React + TypeScript SOC Console (Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: sentra-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Full HTTPS URL of the backend service — must include scheme and full hostname
      # NOTE: fromService.property:host only returns the bare hostname without scheme.
      # Use the explicit hardcoded URL to avoid normalizeApiUrl() stripping .onrender.com
      - key: VITE_API_BASE_URL
        value: "https://sentra-backend-zy7w.onrender.com"
